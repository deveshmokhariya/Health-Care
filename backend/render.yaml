services:
  # Vite React Frontend
  - type: web
    name: healthcare-frontend
    env: static
    buildCommand: "cd frontend && npm install -g pnpm && pnpm install && export VITE_API_URL=https://$VITE_API_URL && pnpm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: healthcare-api
          property: host
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
  # FastAPI Web Service
  - type: web
    name: healthcare-api
    env: python
    buildCommand: "cd backend && pip install -e . && alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: healthcare-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: healthcare-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: healthcare-redis
          property: connectionString
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

  # Celery Worker for Background Jobs
  - type: worker
    name: healthcare-worker
    env: python
    buildCommand: "cd backend && pip install -e ."
    startCommand: "cd backend && celery -A app.workers.celery_app worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: healthcare-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: healthcare-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: healthcare-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"

  # Celery Beat for Scheduled Jobs
  - type: worker
    name: healthcare-beat
    env: python
    buildCommand: "cd backend && pip install -e ."
    startCommand: "cd backend && celery -A app.workers.celery_app beat --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: healthcare-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: healthcare-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: healthcare-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"

  # Redis Service
  - type: redis
    name: healthcare-redis
    plan: free
    ipAllowList: [] # Empty array allows access only from internal Render services

databases:
  - name: healthcare-db
    plan: free
